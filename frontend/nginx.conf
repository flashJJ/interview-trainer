# 前端容器内 nginx 配置：静态托管 + /api 反代（同源，免 CORS）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端导入上限对齐（PDF / DOCX / 网页正文）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # 用变量 + Docker 内置 DNS：后端容器重建后 IP 变化，nginx 能重新解析，
        # 不至于一直 502（静态 proxy_pass 只在启动时解析一次）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 讲题走 SSE 流式输出：必须关缓冲，否则前端要等整段结束才收到
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router history 模式：深链直接刷新时不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
